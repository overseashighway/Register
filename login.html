<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Management Login | OH Connect</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 10% 0%,#fff0cb,transparent 45%),linear-gradient(135deg,#edf6ff,#dceafa);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#17304d}.card{width:min(410px,92vw);background:#fff;padding:34px;border-radius:22px;box-shadow:0 16px 65px #153b6e1f;border:1px solid #dfe7f2}.eyebrow{font-size:11px;color:#b3832e;letter-spacing:.15em;font-weight:800}h1{font-size:29px;margin:10px 0 5px}p{color:#74869a;margin:0 0 24px}.lock{font-size:30px}label{display:block;font-size:12px;font-weight:700;margin:0 0 8px}input{display:block;width:100%;padding:13px;border-radius:11px;border:1px solid #cbd9e9;font-size:15px}button{width:100%;margin-top:12px;background:#b5812b;border:0;padding:13px;border-radius:11px;color:#fff;font-weight:800;cursor:pointer}.error{min-height:22px;display:block;font-size:12px;color:#b23636;margin-top:9px}.back{display:inline-block;margin-top:10px;color:#28709e;text-decoration:none;font-size:12px}.foot{font-size:10px;color:#8895a3;margin-top:16px}</style></head><body><main class="card"><div class="lock">🔐</div><div class="eyebrow">OH CONNECT · MANAGEMENT</div><h1>Website Update Checklist</h1><p>Enter your password to open the management checklist.</p><form id="login-form"><label for="password">Management password</label><input id="password" type="password" required autocomplete="current-password" autofocus placeholder="Enter password"><button type="submit">Unlock Checklist →</button><span id="error" class="error" role="alert"></span></form><a class="back" href="./">← Back to OH Connect</a><div class="foot">This is a client-side access screen. Public static hosting does not protect confidential information.</div></main><script>function hash(v){let h=2166136261;for(let i=0;i<v.length;i++){h^=v.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}document.getElementById("login-form").addEventListener("submit",function(e){e.preventDefault();if(hash(document.getElementById("password").value)==="135a3b5"){sessionStorage.setItem("ohChecklistAccess","granted");location.replace("checklist.html")}else{document.getElementById("error").textContent="Incorrect password. Please try again.";document.getElementById("password").value=""}});</script></body></html>
